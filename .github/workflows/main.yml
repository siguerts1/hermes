name: Main Workflow

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.23
      
      - name: Reset Go Modules
        run: |
          rm -rf go.sum go.mod # Completely remove any broken files
          go mod init hermes  # Reinitialize Go modules (change "hermes" to your module name)
          go mod tidy         # Reinstall all dependencies
          go mod download     # Ensure all packages are downloaded

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.54.2
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Run Linter
        run: |
          export GOFLAGS="-mod=mod"
          golangci-lint run ./cmd ./internal/api/v1/handlers/ ./internal/services/thirdparty/

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build application
        run: go build -o hermers-api cmd/main.go